<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Before and after: texture memory 21.3 MB to 1.3 MB, player artefact 181.41 MB to 171.41 MB, frame time unchanged at 0.60 ms">
  <rect x="0" y="0" width="900" height="330" fill="#ffffff"/>
  <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#111">What the change moved, and what it did not</text>
  <text x="20" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#555">A/B pair measured minutes apart on an idle host: pre-fix build 181.41 MB vs optimised 171.41 MB. Bar length is scaled within each row.</text>

  <!-- Row 1: texture memory -->
  <text x="20" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">Runtime memory, the four prop BaseColor maps</text>
  <rect x="300" y="96" width="440" height="22" fill="#c0392b"/>
  <text x="748" y="113" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#333">21.3 MB before</text>
  <rect x="300" y="124" width="27.6" height="22" fill="#2d7d46"/>
  <text x="336" y="141" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#333">1.3 MB after  (-20.0 MB)</text>

  <!-- Row 2: artefact -->
  <text x="20" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">Windows player artefact</text>
  <rect x="300" y="190" width="440" height="22" fill="#c0392b"/>
  <text x="748" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#333">181.41 MB</text>
  <rect x="300" y="218" width="415.6" height="22" fill="#2d7d46"/>
  <text x="722" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#333">171.41 MB  (-10.00 MB, -5.5 %)</text>

  <!-- Row 3: frame time -->
  <text x="20" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">Main-thread time, mean</text>
  <rect x="300" y="284" width="440" height="22" fill="#7f8c8d"/>
  <text x="748" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#333">0.60 ms</text>
  <rect x="300" y="284" width="440" height="10" fill="#2c3e50"/>
  <text x="20" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Unchanged at 0.60 ms: Game.unity never loads these four textures, so the fix is a memory and storage fix, not a frame-time fix.</text>
</svg>
