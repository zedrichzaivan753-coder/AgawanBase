<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="AgawanBase runtime architecture: three scenes, the runtime scripts, and the data kept outside the scene">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#12243a"/>
    </marker>
    <style>
      .grp { fill:#ffffff; stroke:#c9ced6; stroke-width:1.2; stroke-dasharray:6 4; }
      .box { fill:#f4f7fb; stroke:#12243a; stroke-width:1.3; }
      .boxb { fill:#e9edf3; stroke:#12243a; stroke-width:1.5; }
      .h { font-family:'Segoe UI',Arial,sans-serif; font-size:13px; font-weight:700; fill:#12243a; }
      .t { font-family:'Segoe UI',Arial,sans-serif; font-size:11.5px; fill:#1b2733; }
      .b { font-family:'Segoe UI',Arial,sans-serif; font-size:11.5px; font-weight:600; fill:#12243a; }
      .s { font-family:'Segoe UI',Arial,sans-serif; font-size:10.5px; fill:#4c5661; }
      .ln { stroke:#12243a; stroke-width:1.3; fill:none; marker-end:url(#ar); }
      .lt { font-family:'Segoe UI',Arial,sans-serif; font-size:9px; fill:#4c5661; }
      .ttl { font-family:'Segoe UI',Arial,sans-serif; font-size:15px; font-weight:700; fill:#12243a; }
    </style>
  </defs>

  <text class="ttl" x="20" y="26">AgawanBase 1.0.0-rc1 - runtime architecture (Unity 6000.6.0f1, URP 17.6.0)</text>

  <!-- column boxes -->
  <rect class="grp" x="20" y="46" width="252" height="368" rx="8"/>
  <rect class="grp" x="306" y="46" width="344" height="368" rx="8"/>
  <rect class="grp" x="684" y="46" width="256" height="368" rx="8"/>

  <text class="h" x="36" y="70">Scenes (build order)</text>
  <text class="h" x="322" y="70">Runtime scripts - AgawanBase.Runtime</text>
  <text class="h" x="700" y="70">Data kept outside the scene</text>

  <!-- scenes -->
  <rect class="box" x="36" y="84" width="220" height="46" rx="5"/>
  <text class="b" x="48" y="104">Game.unity</text>
  <text class="s" x="48" y="120">scene 0 - Classic Open Field</text>

  <rect class="box" x="36" y="142" width="220" height="46" rx="5"/>
  <text class="b" x="48" y="162">Map_Palengke.unity</text>
  <text class="s" x="48" y="178">scene 1 - Palengke yard</text>

  <rect class="box" x="36" y="200" width="220" height="46" rx="5"/>
  <text class="b" x="48" y="220">Map_SchoolCampus.unity</text>
  <text class="s" x="48" y="236">scene 2 - School Campus</text>

  <rect class="box" x="36" y="262" width="220" height="132" rx="5"/>
  <text class="b" x="48" y="282">The same Game/UI tree</text>
  <text class="t" x="48" y="302">Title - HOW TO PLAY - CREDITS</text>
  <text class="t" x="48" y="320">PROFILE - MAP SELECT - SETUP</text>
  <text class="t" x="48" y="338">HUD - PAUSE - VICTORY</text>
  <text class="t" x="48" y="356">GAME OVER - DRAW</text>
  <text class="s" x="48" y="378">written by ReleasePanelsBuild</text>

  <!-- runtime -->
  <rect class="boxb" x="322" y="84" width="312" height="50" rx="5"/>
  <text class="b" x="334" y="104">GameManager</text>
  <text class="s" x="334" y="122">screen state machine, pause, restart, quit</text>

  <rect class="boxb" x="322" y="150" width="312" height="50" rx="5"/>
  <text class="b" x="334" y="170">MatchManager</text>
  <text class="s" x="334" y="188">tag, prison, rescue, flag, win / lose / draw</text>

  <rect class="box" x="322" y="216" width="312" height="46" rx="5"/>
  <text class="b" x="334" y="236">TeamManager - EnemyAI (.Scoring .Actions .Perception)</text>
  <text class="s" x="334" y="252">roles, utility scoring, memory, difficulty preset</text>

  <rect class="box" x="322" y="272" width="312" height="46" rx="5"/>
  <text class="b" x="334" y="292">CharacterMotor - CharacterStatus - SprintStamina</text>
  <text class="s" x="334" y="308">one mover and one status for player and AI</text>

  <rect class="box" x="322" y="328" width="312" height="66" rx="5"/>
  <text class="b" x="334" y="348">HudController - VirtualJoystick - SprintButton</text>
  <text class="s" x="334" y="364">OffScreenMarkers - SafeAreaFitter - Visual/ bars</text>
  <text class="s" x="334" y="382">display only: no rule is decided here</text>

  <!-- data -->
  <rect class="box" x="700" y="84" width="224" height="50" rx="5"/>
  <text class="b" x="712" y="104">PlayerProfile</text>
  <text class="s" x="712" y="122">profile.json, signed, one per install</text>

  <rect class="box" x="700" y="150" width="224" height="50" rx="5"/>
  <text class="b" x="712" y="170">MatchSettings</text>
  <text class="s" x="712" y="188">PlayerPrefs: team size, skill, tag hints</text>

  <rect class="box" x="700" y="216" width="224" height="50" rx="5"/>
  <text class="b" x="712" y="236">ReleaseInfo</text>
  <text class="s" x="712" y="254">reads Application.version at runtime</text>

  <rect class="box" x="700" y="282" width="224" height="50" rx="5"/>
  <text class="b" x="712" y="302">GameFeedback</text>
  <text class="s" x="712" y="320">5 one-shot clips, haptic, SOUND key</text>

  <rect class="grp" x="700" y="344" width="224" height="50" rx="5"/>
  <text class="b" x="712" y="364">No service layer</text>
  <text class="s" x="712" y="382">no network call exists in the build</text>

  <!-- arrows -->
  <path class="ln" d="M 258 107 L 316 107"/>
  <text class="lt" x="276" y="100">loads</text>

  <path class="ln" d="M 478 134 L 478 146"/>
  <text class="lt" x="486" y="145">START</text>

  <path class="ln" d="M 634 175 C 668 175 668 109 696 109"/>
  <text class="lt" x="665" y="98" text-anchor="middle">writes the</text>
  <text class="lt" x="665" y="108" text-anchor="middle">result</text>

  <path class="ln" d="M 696 175 C 668 175 666 239 638 239"/>
  <text class="lt" x="665" y="256" text-anchor="middle">team size</text>
  <text class="lt" x="665" y="266" text-anchor="middle">+ skill</text>

  <text class="s" x="20" y="436">Every screen above is a panel inside the loaded scene, so RESTART and TITLE reload that scene; anything that must survive the reload lives in PlayerPrefs or profile.json.</text>
</svg>
